services:

  traefik:
    image: traefik:v3.7.16
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      # Written to a host path under /var/log so fail2ban's /var/log:/var/log:ro
      # mount picks it up for the traefik-auth and traefik-botsearch jails.
      - "/var/log/traefik:/var/log/traefik"
    networks:
      - proxy
    restart: unless-stopped

  pihole:
    container_name: pihole
    image: pihole/pihole:2026.10.0
    user: "0"
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 67:67/udp
      - 8081:80
    environment:
      - TZ=Europe/Amsterdam
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD}
      - FTLCONF_dns_upstreams=1.1.1.1;1.0.0.1
    volumes:
      - /home/tim/pihole/etc-pihole/:/etc/pihole/
      - /home/tim/pihole/etc-dnsmasq.d/:/etc/dnsmasq.d/
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`${PIHOLE_HOST}`)"
      - "traefik.http.routers.pihole.entrypoints=web"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
      - "traefik.http.middlewares.pihole-redirect.redirectregex.regex=^http://([^/]+)/?$$"
      - "traefik.http.middlewares.pihole-redirect.redirectregex.replacement=http://$${1}/admin"
      - "traefik.http.middlewares.pihole-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.pihole.middlewares=pihole-redirect"
    restart: unless-stopped

  fail2ban:
    image: lscr.io/linuxserver/fail2ban:1.1.0-r2-ls47
    container_name: fail2ban
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      # The image copies the full stock config tree into /config/fail2ban and
      # symlinks /etc/fail2ban to it. fail2ban-ui mounts the same host directory
      # as its /etc/fail2ban so it can write the managed jail.local and its
      # ui-custom-action callback where this container actually reads them.
      - /home/tim/fail2ban-config:/config
      - ./service/fail2ban/jail.d/sshd.local:/config/fail2ban/jail.d/sshd.local:ro
      - ./service/fail2ban/jail.d/traefik-auth.local:/config/fail2ban/jail.d/traefik-auth.local:ro
      - ./service/fail2ban/jail.d/traefik-botsearch.local:/config/fail2ban/jail.d/traefik-botsearch.local:ro
      # Custom filter - not bundled in this image, see the file for why.
      - ./service/fail2ban/filter.d/traefik-botsearch.local:/config/fail2ban/filter.d/traefik-botsearch.local:ro
      # Fallback banaction until fail2ban-ui writes jail.local, see the file for why.
      - ./service/fail2ban/paths-overrides.local:/config/fail2ban/paths-overrides.local:ro
      # Expose the socket directory to the host so fail2ban-ui can reach it.
      # The socket is created inside the container; without this mount it
      # never appears on the host and fail2ban-ui's bind mount points at nothing.
      - /home/tim/fail2ban-run:/var/run/fail2ban
      - /var/log:/var/log:ro
    restart: unless-stopped

  fail2ban-ui:
    image: swissmakers/fail2ban-ui:v1.6.1
    container_name: fail2ban-ui
    environment:
      - TZ=Europe/Amsterdam
      # fail2ban runs on the host network, so its ban/unban callbacks need a
      # host-reachable address - the default 127.0.0.1:8080 is Traefik's
      # dashboard, hence the loopback-only port below.
      - CALLBACK_URL=http://127.0.0.1:3080
    ports:
      - "127.0.0.1:3080:8080"
    volumes:
      # UI settings, ban history database and callback secret
      - /home/tim/fail2ban-ui:/config
      # Same config tree as the fail2ban container. fail2ban-client parses the
      # config client-side on test/reload, so the UI needs the full tree.
      - /home/tim/fail2ban-config/fail2ban:/etc/fail2ban
      # The repo files above are bind-mounted into the fail2ban container
      # only - the host directory just holds Docker's empty placeholders, so
      # mount them here too or the UI's reloads would see empty jails.
      - ./service/fail2ban/jail.d/sshd.local:/etc/fail2ban/jail.d/sshd.local:ro
      - ./service/fail2ban/jail.d/traefik-auth.local:/etc/fail2ban/jail.d/traefik-auth.local:ro
      - ./service/fail2ban/jail.d/traefik-botsearch.local:/etc/fail2ban/jail.d/traefik-botsearch.local:ro
      - ./service/fail2ban/filter.d/traefik-botsearch.local:/etc/fail2ban/filter.d/traefik-botsearch.local:ro
      - ./service/fail2ban/paths-overrides.local:/etc/fail2ban/paths-overrides.local:ro
      # Same host directory as fail2ban's /var/run/fail2ban mount — Docker
      # can't bind-mount a socket file that doesn't exist yet, so mount the
      # whole directory and let fail2ban create the socket inside it.
      - /home/tim/fail2ban-run:/var/run/fail2ban
      # Lets the UI test a jail's logpath before enabling it
      - /var/log:/var/log:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fail2ban-ui.rule=Host(`${FAIL2BAN_HOST}`)"
      - "traefik.http.routers.fail2ban-ui.entrypoints=web"
      - "traefik.http.services.fail2ban-ui.loadbalancer.server.port=8080"
    restart: unless-stopped

  nebula-sync:
    image: ghcr.io/lovelaze/nebula-sync:v0.11.3
    container_name: nebula-sync
    environment:
      - PRIMARY=${PRIMARY}
      - REPLICAS=${REPLICAS}
      - FULL_SYNC=true
      - RUN_GRAVITY=false
      - CRON=0 * * * *
    restart: unless-stopped

networks:
  proxy:
    driver: bridge
